<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegram Media Downloader</title>
  <link href="static/layui/css/layui.css" rel="stylesheet">
  <link href="static/css/index.css" rel="stylesheet">
  <style>
    body {
      padding: 6px 16px;
    }
  </style>
</head>

<body>
  <div class="layui-tab" lay-filter="telegram_media_downloader">
    <div class="header-title layui-tab-brief">
      <ul class="layui-tab-title">
        <li class="layui-this">Download Task List</li>
        </ul>
      <div class="stop-btn" id="download_state" data-value="{{ download_state }}" onclick="download_state_change(this)"> {{ download_state }} </div>
    </div>
    <div class="layui-tab-content" style="padding: 0;">
      <div class="layui-tab-item layui-show">
        <table class="layui-hide" id="download_list" lay-filter="download_list"></table>
      </div>
      </div>
  </div>

  <div class="layui-footer">
    <div class="layui-row layui-col-space1">
      <div class="layui-col-md2">
        <p>Telegram Media Downloader V <b id="app_version" style="color: #009688;">undefined</b>
      </div>
      <div class="layui-col-md7">
      </div>
      <div class="layui-col-md3">
        <div style="padding: 5px; float: right;">
          <i class="layui-icon layui-icon-download-circle"
            style="font-size: 16px; color: #5FB878; font-weight: 700; margin-left: 15px;">
            <i id="download_speed_title" style="color: black;"> 0.00 B/s </i>
          </i>
        </div>
      </div>
    </div>
  </div>

  <script src="static/layui/layui.js"></script>
  <script>

    layui.use(['table', 'element'], function () {
      var table = layui.table;
      var element = layui.element;
      var layer = layui.layer;
      var $ = layui.$;
      var download_list_table_data = new Array()

      $.ajax({
        url: "get_app_version"
        , type: "get"
        , async: false
        , dataType: "text"
        , success: function (result) {
          $("#app_version").html(result)
        }
      });

      download_state_change = function(e) {
        $.ajax({
        url: "set_download_state?state=" + e.dataset.value
        , type: "post"
        , async: false
        , dataType: "text"
        , success: function (result) {
          $("#download_state").html(result)
          e.dataset.value=result
        }
      });
    }

      // 渲染主表格
      tableIns = table.render({
        elem: '#download_list'
        , data: download_list_table_data
        , title: 'download_list'
        , height: 'full-160'
        , limit: 10000
        , cols: [[
          { field: 'id', title: 'Msg ID', width: 90, fixed: 'left', sort: true},
          { field: 'chat', title: 'Source Channel', width: 160 },
          { field: 'filename', title: 'File Name', width: 200},
          { field: 'total_size', title: 'Size', width: 100, align: 'center' },
          { field: 'status', title: 'Status', width: 120, sort: true, align: 'center', templet: function(d){
              if(d.status === 'Downloading') return '<span style="color: #1E9FFF; font-weight:bold;">Downloading</span>';
              if(d.status === 'Success') return '<span style="color: #5FB878;">Success</span>';
              if(d.status === 'Failed') return '<span style="color: #FF5722;">Failed</span>';
              if(d.status === 'Queued') return '<span style="color: #009688;">Queued</span>';
              if(d.status === 'File Missing') return '<span style="color: #999; text-decoration: line-through;">File Missing</span>';
              return d.status;
          }},
          {
            field: 'download_progress', title: 'Progress', width: 150, align: 'center', templet: function (d) {
              var ys = '';
              var val = parseFloat(d.download_progress);
              if (val < 100 && d.status === 'Downloading') {
                ys = 'layui-bg-blue'
              } else if (val === 100) {
                ys = 'layui-bg-green'
              } else {
                ys = 'layui-bg-gray'
              }
              return '<div class="layui-progress layui-progress-big" lay-showpercent="true"  lay-filter="down-' + d.chat + '-' + d.id + '"><div class="layui-progress-bar ' + ys + '" lay-percent="' + d.download_progress + '%"></div></div>'
            }
          },
          { field: 'download_speed', title: 'Speed', width: 100, align: 'center' },
          { field: 'receive_time', title: 'Received At', width: 170, sort: true },
          { field: 'start_time', title: 'Started At', width: 170, sort: true },
          { field: 'finish_time', title: 'Finished At', width: 170, sort: true },
          { field: 'save_path', title: 'Save Path', width: 300 }
        ]]
        , done: function (res, currentCount) {
          element.render()
        }
      });

      function update_download_list() {
        $.ajax({
          url: "get_download_list"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {

            // 全量刷新数据，因为历史记录可能变动（状态变更），且条目不会太多
            // 为了保持进度条动画，如果 table 已经渲染，我们可以只更新数据而不重绘整个table
            // 但 Layui table reload 是最简单的

            // 简单比对：如果数据量变化或者有状态变更，则重载
            // 这里为了简化实现，直接重载数据

            // 但如果正在下载，重载会导致闪烁。我们尝试只更新进度条。
            // 可是历史记录合并后，数据结构变了。我们采用 data reload。

            // 优化：仅当页面打开且有活动时更新。
            // 这里我们使用 layui table 的 reload 方法，仅更新 data

            table.reload('download_list', {
                data: result
            });

            // 重新渲染进度条，因为 reload 可能不会触发 element.render('progress')
            element.render('progress');
          }
        });
      };

      function update_download_status() {
        $.ajax({
          url: "get_download_status"
          , type: "get"
          , async: false
          , dataType: "json"
          , success: function (result) {
            $("#download_speed_title").html(result.download_speed)
          }
        });
      };

      // 每 1.5 秒刷新一次列表，避免太频繁
      var update_download_list_int = self.setInterval(update_download_list, 1500);
      var update_download_status_int = self.setInterval(update_download_status, 1000);

    });
  </script>
</body>

</html>
